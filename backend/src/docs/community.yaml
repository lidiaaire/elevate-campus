openapi: 3.0.3

info:
  title: Elevate Your English — Community API
  version: 1.0.0

tags:
  - name: Community
    description: >
      MVP social de Comunidad. Montado bajo `/api/community`. No existe
      modelo `Cohort`: el "scope" (cohorte) sigue siendo implícito vía
      `User.assignedTeacherId`, el mismo criterio que Achievements,
      Certificates y el resto del proyecto.

      El feed agrega tres fuentes: dos derivadas (logros desbloqueados,
      certificados emitidos) y una persistida propia (`CommunityPost`, que
      cubre tanto posts como announcements). Los posts y comentarios usan
      **soft delete** (`isDeleted: true`) — nunca borrado físico.

      Las tres rutas de escritura (`POST /posts`, `POST
      /posts/{postId}/comments`, `POST /announcements`) comparten una única
      instancia de rate limiter (`communityWriteLimiter`): 100 requests por
      IP cada 15 minutos, montado después de `verifyToken` (una petición sin
      token sigue devolviendo 401, no consume cupo). Las rutas GET y DELETE
      no llevan rate limiter.

paths:

  /api/community/feed:
    get:
      tags: [Community]
      summary: Listar el feed combinado de la cohorte (o global para admin)
      description: >
        Combina logros desbloqueados, certificados emitidos y
        posts/announcements en un único feed ordenado por `eventDate`
        descendente (más reciente primero), paginado en memoria.

        El scope depende del rol del usuario autenticado:

        - **STUDENT**: compañeros con el mismo `assignedTeacherId` que el
          propio actor (se incluye a sí mismo). Si el actor no tiene
          `assignedTeacherId`, su scope es únicamente él mismo.
        - **TEACHER**: alumnos cuyo `assignedTeacherId` es el propio actor,
          más los posts/announcements de su propia cohorte y los
          announcements globales de ADMIN.
        - **ADMIN**: todos los alumnos de la academia; todos los posts
          visibles, sin filtro de scope.

        Cada item del feed tiene el shape
        `{ id, type, eventDate, author: {_id, firstName, lastName, email,
        role}, context }`. `type` es uno de `ACHIEVEMENT`, `CERTIFICATE`,
        `POST` o `ANNOUNCEMENT`. `context` varía según `type` (ver
        `FeedItem`).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Feed combinado, paginado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  docs:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedItem"
                  total:
                    type: integer
                    description: Total de items combinados (sin paginar).
                    example: 3
              example:
                docs:
                  - id: "665f3e4f5a6b7c8d9e0f1b40"
                    type: "POST"
                    eventDate: "2026-07-30T09:00:00.000Z"
                    author:
                      _id: "663e0a1b2c3d4e5f6a7b8c9d"
                      firstName: "Sarah"
                      lastName: "Mitchell"
                      email: "sarah.mitchell@demo.com"
                      role: "student"
                    context:
                      content: "¡Acabo de terminar la unidad 3!"
                      commentCount: 2
                  - id: "665f3e4f5a6b7c8d9e0f1b41"
                    type: "ACHIEVEMENT"
                    eventDate: "2026-07-29T18:00:00.000Z"
                    author:
                      _id: "663e0a1b2c3d4e5f6a7b8c9d"
                      firstName: "Sarah"
                      lastName: "Mitchell"
                      email: "sarah.mitchell@demo.com"
                      role: "student"
                    context:
                      name: "First Steps"
                      slug: "first_lesson_completed"
                      description: "Completed your first lesson."
                      icon: "🎯"
                      category: "LESSON"
                      points: 10
                      rarity: "COMMON"
                total: 2
        "400":
          description: "`page` o `limit` no cumplen el formato esperado."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "VALIDATION_ERROR"
                message: "Datos de entrada inválidos"
                fields:
                  - field: "limit"
                    message: "limit debe ser un entero entre 1 y 100"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/community/posts:
    post:
      tags: [Community]
      summary: Crear una publicación
      description: >
        Crea un `CommunityPost` de tipo `POST`. El body solo acepta
        `content` — **`type` y `scopeTeacherId` los decide siempre el
        Service**; no se validan ni se leen del body aunque el cliente los
        envíe.

        `scopeTeacherId` se resuelve así: TEACHER → su propio id; STUDENT →
        su `assignedTeacherId` (o su propio id si no tiene profesor
        asignado).

        Solo **STUDENT** y **TEACHER** pueden publicar. **ADMIN → 403**
        (usa `POST /community/announcements` para publicar como admin).

        Sujeto a rate limiting (`communityWriteLimiter`): 100 requests/15min
        compartidas con `POST /announcements` y `POST
        /posts/{postId}/comments`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
            example:
              content: "¡Acabo de terminar la unidad 3!"
      responses:
        "201":
          description: Publicación creada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: "#/components/schemas/CommunityPost"
        "400":
          description: "`content` ausente o fuera de longitud (1–2000 caracteres)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "VALIDATION_ERROR"
                message: "Datos de entrada inválidos"
                fields:
                  - field: "content"
                    message: "El contenido es obligatorio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El rol autenticado es ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "INSUFFICIENT_ROLE"
                message: "No tienes permiso para realizar esta acción"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/community/announcements:
    post:
      tags: [Community]
      summary: Crear un anuncio
      description: >
        Crea un `CommunityPost` de tipo `ANNOUNCEMENT`. El body solo acepta
        `content` (misma validación que `POST /posts`, reutiliza el mismo
        schema) — **`type` y `scopeTeacherId` los decide siempre el
        Service**; no se validan ni se leen del body.

        `scopeTeacherId` se resuelve así: **TEACHER** → su propio id
        (announcement visible solo en su cohorte); **ADMIN** → `null`
        (announcement global, visible para toda la academia).

        Solo **TEACHER** y **ADMIN** pueden publicar. **STUDENT → 403**.

        Sujeto a rate limiting (`communityWriteLimiter`): 100 requests/15min
        compartidas con `POST /posts` y `POST /posts/{postId}/comments`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostInput"
            example:
              content: "La próxima semana no habrá clase por festivo."
      responses:
        "201":
          description: Anuncio creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: "#/components/schemas/CommunityPost"
        "400":
          description: "`content` ausente o fuera de longitud (1–2000 caracteres)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "VALIDATION_ERROR"
                message: "Datos de entrada inválidos"
                fields:
                  - field: "content"
                    message: "El contenido es obligatorio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: El rol autenticado es STUDENT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "INSUFFICIENT_ROLE"
                message: "No tienes permiso para realizar esta acción"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/community/posts/{postId}/comments:
    get:
      tags: [Community]
      summary: Listar los comentarios de una publicación
      description: >
        Devuelve los comentarios visibles (`isDeleted: false`) del post
        indicado, ordenados cronológicamente. Requiere que el post sea
        accesible para el scope del actor — mismo criterio que el feed:
        ADMIN sin restricción; STUDENT/TEACHER solo si el post pertenece a
        su propia cohorte, o es un announcement global de ADMIN
        (`scopeTeacherId: null`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "200":
          description: Comentarios del post.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityComment"
              example:
                comments:
                  - _id: "665f3e4f5a6b7c8d9e0f1b50"
                    content: "¡Genial, sigue así!"
                    author:
                      _id: "663e0a1b2c3d4e5f6a7b8c9e"
                      firstName: "Emma"
                      lastName: "Johnson"
                      email: "emma.johnson@elevate.com"
                      role: "teacher"
                    createdAt: "2026-07-30T09:15:00.000Z"
        "400":
          $ref: "#/components/responses/InvalidPostId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PostForbidden"
        "404":
          $ref: "#/components/responses/PostNotFound"

    post:
      tags: [Community]
      summary: Crear un comentario sobre una publicación
      description: >
        Crea un `CommunityComment` sobre el post indicado. El body solo
        acepta `content` — `post` y `author` los decide el
        controller/service a partir del param de ruta y del token, nunca el
        cliente.

        Cualquier rol autenticado puede comentar, pero solo sobre un post
        accesible para su scope (mismo criterio que `GET
        /posts/{postId}/comments`). Incrementa `commentCount` del post de
        forma atómica.

        Sujeto a rate limiting (`communityWriteLimiter`): 100 requests/15min
        compartidas con `POST /posts` y `POST /announcements`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentInput"
            example:
              content: "¡Genial, sigue así!"
      responses:
        "201":
          description: Comentario creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment:
                    $ref: "#/components/schemas/CommunityComment"
        "400":
          description: >
            `postId` no es un ObjectId válido, o `content` ausente/fuera de
            longitud (1–2000 caracteres).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidPostId:
                  summary: postId inválido
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Datos de entrada inválidos"
                    fields:
                      - field: "postId"
                        message: "El postId debe ser un ObjectId de MongoDB válido"
                contentEmpty:
                  summary: content ausente
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Datos de entrada inválidos"
                    fields:
                      - field: "content"
                        message: "El contenido es obligatorio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PostForbidden"
        "404":
          $ref: "#/components/responses/PostNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/community/posts/{postId}:
    delete:
      tags: [Community]
      summary: Eliminar una publicación (soft delete)
      description: >
        Marca el post indicado como `isDeleted: true`. **Sin borrado
        físico.**

        Permiso: el autor siempre puede; **ADMIN** siempre puede;
        **TEACHER** solo si el post pertenece a su propia cohorte
        (`post.scopeTeacherId === su propio id`); **STUDENT** nunca puede
        borrar un post ajeno, ni dentro de su propia cohorte.

        Post inexistente o ya borrado → 404 (un segundo `DELETE` sobre el
        mismo post no encuentra nada visible y no repite efectos).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
      responses:
        "204":
          description: Publicación eliminada (soft delete). Sin body.
        "400":
          $ref: "#/components/responses/InvalidPostId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            El actor no es el autor, no es ADMIN, ni es un TEACHER cuya
            cohorte coincide con el `scopeTeacherId` del post.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "POST_DELETE_FORBIDDEN"
                message: "No tienes permiso para eliminar esta publicación"
        "404":
          description: El post no existe o ya estaba eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "POST_NOT_FOUND"
                message: "Publicación no encontrada"

  /api/community/posts/{postId}/comments/{commentId}:
    delete:
      tags: [Community]
      summary: Eliminar un comentario (soft delete)
      description: >
        Marca el comentario indicado como `isDeleted: true`. **Sin borrado
        físico.** Decrementa `commentCount` del post padre de forma atómica
        (nunca en negativo).

        Permiso: mismo criterio que `DELETE /posts/{postId}`, pero el scope
        aplicable es el del **post padre** del comentario (el comentario no
        lleva su propio `scopeTeacherId`): autor del comentario siempre;
        ADMIN siempre; TEACHER solo si el post padre pertenece a su propia
        cohorte; STUDENT nunca sobre contenido ajeno.

        Comentario inexistente, ya borrado, o que no pertenece al `postId`
        de la ruta → 404 (no se distingue de "no existe").
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/postId"
        - $ref: "#/components/parameters/commentId"
      responses:
        "204":
          description: Comentario eliminado (soft delete). Sin body.
        "400":
          description: "`postId` o `commentId` no son ObjectId de MongoDB válidos."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "VALIDATION_ERROR"
                message: "Datos de entrada inválidos"
                fields:
                  - field: "commentId"
                    message: "El commentId debe ser un ObjectId de MongoDB válido"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            El actor no es el autor del comentario, no es ADMIN, ni es un
            TEACHER cuya cohorte coincide con el `scopeTeacherId` del post
            padre.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "COMMENT_DELETE_FORBIDDEN"
                message: "No tienes permiso para eliminar este comentario"
        "404":
          description: >
            El comentario no existe, ya estaba eliminado, o no pertenece al
            `postId` indicado en la ruta. También 404 si el post padre ya
            no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                commentNotFound:
                  summary: Comentario no encontrado
                  value:
                    error: "COMMENT_NOT_FOUND"
                    message: "Comentario no encontrado"
                postNotFound:
                  summary: Post padre no encontrado
                  value:
                    error: "POST_NOT_FOUND"
                    message: "Publicación no encontrada"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    postId:
      name: postId
      in: path
      required: true
      description: ObjectId del CommunityPost.
      schema:
        type: string
        example: "665f3e4f5a6b7c8d9e0f1b40"
    commentId:
      name: commentId
      in: path
      required: true
      description: ObjectId del CommunityComment.
      schema:
        type: string
        example: "665f3e4f5a6b7c8d9e0f1b50"

  responses:
    Unauthorized:
      description: Token ausente, expirado o inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tokenMissing:
              summary: Sin token
              value:
                error: "TOKEN_MISSING"
                message: "Token de autenticación requerido"
            tokenExpired:
              summary: Token caducado
              value:
                error: "TOKEN_EXPIRED"
                message: "El token ha expirado"
            tokenInvalid:
              summary: Token malformado
              value:
                error: "TOKEN_INVALID"
                message: "Token inválido"
    InvalidPostId:
      description: "`postId` no es un ObjectId de MongoDB válido."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "VALIDATION_ERROR"
            message: "Datos de entrada inválidos"
            fields:
              - field: "postId"
                message: "El postId debe ser un ObjectId de MongoDB válido"
    PostForbidden:
      description: El post existe pero pertenece a otra cohorte.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "POST_FORBIDDEN"
            message: "No tienes acceso a esta publicación"
    PostNotFound:
      description: El post no existe o ya estaba eliminado (soft-deleted).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "POST_NOT_FOUND"
            message: "Publicación no encontrada"
    TooManyRequests:
      description: >
        Límite de escritura de Community superado (100 requests/15min,
        compartido entre `POST /posts`, `POST /posts/{postId}/comments` y
        `POST /announcements`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "TOO_MANY_REQUESTS"
            message: "Has publicado demasiado contenido en Community. Inténtalo de nuevo en unos minutos."

  schemas:
    FeedItem:
      type: object
      description: >
        Item normalizado del feed combinado. `context` varía según `type`:
        para `ACHIEVEMENT`, campos del logro; para `CERTIFICATE`, campos del
        certificado; para `POST`/`ANNOUNCEMENT`, `{ content, commentCount }`.
      properties:
        id:
          type: string
          example: "665f3e4f5a6b7c8d9e0f1b40"
        type:
          type: string
          enum: [ACHIEVEMENT, CERTIFICATE, POST, ANNOUNCEMENT]
          example: "POST"
        eventDate:
          type: string
          format: date-time
          example: "2026-07-30T09:00:00.000Z"
        author:
          type: object
          properties:
            _id:
              type: string
              example: "663e0a1b2c3d4e5f6a7b8c9d"
            firstName:
              type: string
              example: "Sarah"
            lastName:
              type: string
              example: "Mitchell"
            email:
              type: string
              format: email
              example: "sarah.mitchell@demo.com"
            role:
              type: string
              enum: [admin, teacher, student]
              example: "student"
        context:
          type: object
          description: Shape variable según `type` (ver descripción del schema).

    CommunityPost:
      type: object
      description: Documento `CommunityPost` devuelto tras crearlo.
      properties:
        _id:
          type: string
          example: "665f3e4f5a6b7c8d9e0f1b40"
        author:
          type: string
          description: ObjectId del User autor.
          example: "663e0a1b2c3d4e5f6a7b8c9d"
        type:
          type: string
          enum: [POST, ANNOUNCEMENT]
          example: "POST"
        content:
          type: string
          maxLength: 2000
          example: "¡Acabo de terminar la unidad 3!"
        scopeTeacherId:
          type: string
          nullable: true
          description: >
            Cohorte a la que pertenece. `null` únicamente en un
            ANNOUNCEMENT global de ADMIN.
          example: "663e0a1b2c3d4e5f6a7b8c9e"
        commentCount:
          type: integer
          minimum: 0
          default: 0
          example: 0
        isDeleted:
          type: boolean
          default: false
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CommunityComment:
      type: object
      description: Shape compartido entre `GET` y `POST` de comentarios.
      properties:
        _id:
          type: string
          example: "665f3e4f5a6b7c8d9e0f1b50"
        content:
          type: string
          maxLength: 2000
          example: "¡Genial, sigue así!"
        author:
          type: object
          properties:
            _id:
              type: string
              example: "663e0a1b2c3d4e5f6a7b8c9e"
            firstName:
              type: string
              example: "Emma"
            lastName:
              type: string
              example: "Johnson"
            email:
              type: string
              format: email
              example: "emma.johnson@elevate.com"
            role:
              type: string
              enum: [admin, teacher, student]
              example: "teacher"
        createdAt:
          type: string
          format: date-time
          example: "2026-07-30T09:15:00.000Z"

    CreatePostInput:
      type: object
      required: [content]
      description: >
        Único input aceptado por `POST /posts` y `POST /announcements`. `type`
        no es un campo válido del body — se ignora si se envía, el Service
        lo fuerza siempre en backend.
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          example: "¡Acabo de terminar la unidad 3!"

    CreateCommentInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          example: "¡Genial, sigue así!"

    Error:
      type: object
      properties:
        error:
          type: string
          example: "POST_NOT_FOUND"
        message:
          type: string
          example: "Publicación no encontrada"
        fields:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
