<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.55" />
    </linearGradient>
  </defs>
  <!-- Fondo degradado -->
  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Círculos decorativos -->
  <circle cx="620" cy="80" r="180" fill="#fff" fill-opacity="0.06" />
  <circle cx="150" cy="380" r="120" fill="#fff" fill-opacity="0.05" />
  <circle cx="700" cy="350" r="90" fill="#fff" fill-opacity="0.07" />
  <!-- Overlay inferior -->
  <rect width="800" height="450" fill="url(#overlay)" />
  <!-- Nivel -->
  <rect x="40" y="36" width="54" height="28" rx="6" fill="#fff" fill-opacity="0.2" />
  <text x="67" y="55" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">A1</text>
  <!-- Título -->
  <text x="40" y="340" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#fff">English Survival Kit</text>
  <!-- Tagline -->
  <text x="40" y="378" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#e0f2fe">Your first words open every door.</text>
  <!-- Icono avión -->
  <text x="700" y="240" font-size="72" fill="#fff" fill-opacity="0.18" font-family="serif">✈</text>
</svg>
